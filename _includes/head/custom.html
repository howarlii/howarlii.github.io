{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ '/assets/css/academicons.min.css' | relative_url }}">

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Original cartoon avatar, reused for every icon format. -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=cartoon-1"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=cartoon-1"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=cartoon-1" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=cartoon-1" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="{{ base_path }}/images/favicon.ico?v=cartoon-1"/>
<meta name="theme-color" content="var(--global-bg-color)"/>

<!-- end custom head snippets -->

<!-- Site-specific styles extend the upstream light and dark themes. -->
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
{% for stylesheet in page.stylesheets %}
<link rel="stylesheet" href="{{ stylesheet | relative_url }}">
{% endfor %}
