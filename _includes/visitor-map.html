<div class="visitor-map" data-visitor-map>
  <a href="{{ site.visitor_map.stats_url }}" title="Visitor statistics" target="_blank" rel="noopener">
    <img src="{{ site.visitor_map.image_url | escape }}" alt="Visitor map" width="300" height="171" />
  </a>
  <p class="visitor-map__unavailable" hidden>Visitor map is currently unavailable.</p>
</div>
